<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sing Practice</title>

<link rel="manifest" href="/singing-app/manifest.json">

<meta name="theme-color" content="#121212">

<meta name="mobile-web-app-capable" content="yes">

<style>
  /* ---------- LOOK & FEEL (edit these freely) ---------- */
  :root {
    --bg: #12141c;
    --card: #1c2030;
    --text: #f2f4fa;
    --muted: #8a92ab;
    --good: #3ddc97;
    --ok: #ffc857;
    --bad: #ff5d73;
    --accent: #6c8cff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }
  /* The whole app is one column: readout on top, big graph in the middle, controls at the bottom */
  #app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 10px;
    max-width: 640px;
    margin: 0 auto;
  }
  .card { background: var(--card); border-radius: 14px; padding: 10px 14px; }

  /* Panels that slide away during a warmup (top readout slides up, settings slide down) */
  .collapsible {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.45s ease, opacity 0.35s ease;
  }
  .collapsible > .inner { overflow: hidden; min-height: 0; }
  .collapsible.collapsed {
    grid-template-rows: 0fr; opacity: 0; pointer-events: none; visibility: hidden;
    transition: grid-template-rows 0.45s ease, opacity 0.35s ease, visibility 0s 0.45s;
  }
  .moreBtn { background: none; color: var(--muted); font-size: 0.8rem; font-weight: 500; padding: 6px; margin-bottom: 6px; }
  #moreArrow { display: inline-block; transition: transform 0.3s ease; }
  .moreBtn.open #moreArrow { transform: rotate(180deg); }
  #topWrap > .inner { padding-bottom: 8px; }

  /* Compact readout */
  #top { flex: none; }
  #readout { display: flex; align-items: center; gap: 14px; }
  #note { font-size: 2.6rem; font-weight: 700; line-height: 1; min-width: 5.2rem; }
  #info { flex: 1; font-variant-numeric: tabular-nums; }
  #freq { color: var(--muted); font-size: 0.85rem; }
  #centsText { font-size: 1.1rem; min-height: 1.4rem; }

  /* Tuning meter: centre line = perfectly in tune */
  #meter { position: relative; height: 14px; margin-top: 8px; background: #272c42; border-radius: 7px; overflow: hidden; }
  #meter .centre { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--muted); }
  #needle { position: absolute; top: 2px; bottom: 2px; left: 50%; width: 6px; margin-left: -3px; border-radius: 3px; background: var(--muted); }

  /* Big pitch graph fills all spare space */
  #graphWrap { position: relative; flex: 1; min-height: 220px; background: #10131d; border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
  canvas { width: 100%; height: 100%; display: block; }

  /* Warmup results popup (sits on top of the graph) */
  #results {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(16, 19, 29, 0.88);
    padding: 16px;
  }
  #resultsBox { background: var(--card); border-radius: 16px; padding: 20px; text-align: center; width: 100%; max-width: 340px; }
  #resTitle { color: var(--muted); font-size: 0.85rem; }
  #resPct { font-size: 3.4rem; font-weight: 700; line-height: 1.1; margin: 4px 0 10px; }
  #resText { font-size: 0.95rem; line-height: 1.5; margin-bottom: 14px; }
  #resText div { margin-bottom: 4px; }

  /* Controls */
  #bottom { flex: none; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .row label { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
  .row input[type=range] { flex: 1; }
  #gainLabel { color: var(--muted); font-size: 0.8rem; min-width: 2.5rem; text-align: right; }
  #levelWrap { height: 6px; background: #272c42; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  #levelBar { height: 100%; width: 0%; background: var(--accent); }
  #levelText { color: var(--muted); font-size: 0.7rem; text-align: right; margin: -4px 0 8px; min-height: 0.9rem; }
  button { background: var(--accent); color: white; border: 0; font-size: 1.05rem; font-weight: 600; padding: 12px; border-radius: 12px; width: 100%; }
  button.stop { background: var(--bad); }
  button:disabled { opacity: 0.4; }
  #status { color: var(--muted); font-size: 0.75rem; margin-top: 6px; text-align: center; }
  #settingsWrap > .inner { padding-bottom: 2px; }

  /* Mode tabs (Free sing / Warmup) */
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab { flex: 1; background: #272c42; color: var(--muted); font-size: 0.9rem; padding: 8px; border-radius: 10px; }
  .tab.active { background: var(--accent); color: white; }

  /* Warmup settings */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .grid label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 0.75rem; }
  select { background: #272c42; color: var(--text); border: 0; border-radius: 8px; padding: 8px; font-size: 0.9rem; width: 100%; }
  .grid input[type=range] { width: 100%; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 8px; color: var(--muted); font-size: 0.85rem; }
  .checks label { display: flex; align-items: center; gap: 6px; }

  /* Song settings */
  .wide { grid-column: 1 / -1; }
  .stepper { display: flex; gap: 6px; }
  .stepper button { width: auto; flex: 1; padding: 5px 0; font-size: 1.1rem; background: #272c42; }
  .hint { opacity: 0.7; }
</style>
</head>
<body>
<div id="app">

  <div id="topWrap" class="collapsible"><div class="inner">
    <div id="top" class="card">
      <div id="readout">
        <div id="note">–</div>
        <div id="info">
          <div id="freq">Press Start and sing a note</div>
          <div id="centsText"></div>
        </div>
      </div>
      <div id="meter"><div class="centre"></div><div id="needle"></div></div>
    </div>
  </div></div>

  <div id="graphWrap">
    <canvas id="history"></canvas>
    <div id="results" hidden>
      <div id="resultsBox">
        <div id="resTitle">Warmup complete</div>
        <div id="resPct">0%</div>
        <div id="resText"></div>
        <button id="resClose">Close</button>
      </div>
    </div>
  </div>

  <div id="bottom" class="card">
   <div id="settingsWrap" class="collapsible"><div class="inner">

    <div class="tabs">
      <button id="modeFree" class="tab active">Free sing</button>
      <button id="modeWarmup" class="tab">Warmup</button>
      <button id="modeSong" class="tab">Song</button>
    </div>

    <div id="warmupControls" hidden>
      <div class="grid">
        <label>Exercise <select id="exerciseSel"></select></label>
        <label>Root note <select id="rootSel"></select></label>
        <label>Rounds (+1 semitone each)
          <select id="roundsSel">
            <option value="1">1</option>
            <option value="3" selected>3</option>
            <option value="5">5</option>
            <option value="8">8</option>
          </select>
        </label>
        <label>Tempo: <span id="bpmLabel">80</span> BPM
          <input id="bpmSlider" type="range" min="50" max="140" step="5" value="80">
        </label>
      </div>
    </div>

    <div id="songControls" hidden>
      <div class="grid">
        <label class="wide">Song <select id="songSel"></select></label>
        <label><span>Speed: <span id="speedLabel">100%</span></span>
          <input id="speedSlider" type="range" min="50" max="120" step="5" value="100">
        </label>
        <label><span>Key: <span id="keyLabel">C major</span></span>
          <div class="stepper"><button id="keyDown" aria-label="Key down">−</button><button id="keyUp" aria-label="Key up">+</button></div>
        </label>
        <label class="wide"><span>Vocal guide: <span id="melLabel">50%</span> <span class="hint">(0% = backing track only)</span></span>
          <input id="melSlider" type="range" min="0" max="100" step="5" value="50">
        </label>
      </div>
    </div>

    <button id="moreBtn" class="moreBtn" aria-expanded="false">More settings <span id="moreArrow">▾</span></button>

    <!-- Extra settings: hidden until you tap "More settings" -->
    <div id="moreWrap" class="collapsible collapsed"><div class="inner">
      <div class="row">
        <label>Mic boost</label>
        <input id="gainSlider" type="range" min="0.1" max="20" step="0.1" value="1">
        <span id="gainLabel">1.0×</span>
      </div>
      <div id="levelWrap"><div id="levelBar"></div></div>
      <div id="levelText">mic level</div>

      <div id="moreWarmup" hidden>
        <div class="checks">
          <label><input type="checkbox" id="pianoChk" checked> Piano guide</label>
          <label><input type="checkbox" id="metroChk" checked> Metronome</label>
          <label><input type="checkbox" id="octaveChk" checked> Any octave</label>
        </div>
        <div class="row">
          <label>Guide volume <span id="volLabel">300%</span></label>
          <input id="volSlider" type="range" min="50" max="800" step="10" value="300">
        </div>
        <div class="row">
          <label>Audio sync <span id="syncLabel">250 ms</span></label>
          <input id="syncSlider" type="range" min="-100" max="600" step="10" value="250">
        </div>
      </div>
    </div></div>

   </div></div>

    <button id="toggleBtn">Start</button>
    <div id="status">Tip: use headphones later when playing backing tracks.</div>
  </div>

</div>

<script>
/* =====================================================
   1. SETTINGS (safe to tweak)
   ===================================================== */
const FFT_SIZE          = 2048;   // audio window size. Bigger = more accurate for low notes, but slower.
const MIN_FREQ          = 70;     // lowest note we look for (Hz)
const MAX_FREQ          = 1200;   // highest note we look for (Hz)
const YIN_THRESHOLD     = 0.2;    // lower = stricter (fewer false notes), higher = more sensitive
const VOLUME_GATE       = 0.01;   // ignore sounds quieter than this AFTER the boost

const IN_TUNE_CENTS     = 20;     // within this many cents = green
const CLOSE_CENTS       = 35;     // within this many cents = yellow, beyond = red
const DISPLAY_SMOOTHING = 0.12;   // how much the big note/cents readout smooths out wobble.
                                  // smaller = steadier but slower to react (try 0.05 – 0.3)

const FREE_VISIBLE_SECONDS   = 8; // seconds of time shown across the graph in Free sing mode
const WARMUP_VISIBLE_SECONDS = 6; // seconds shown across the graph during a warmup.
                                  // Fewer seconds = longer boxes and a faster-scrolling map (try 3 – 6)
const NOW_POSITION      = 0.33;   // where the "now" line sits, as a fraction of the graph width from the left.
                                  // 0.33 = a third of the way in. Your pitch is drawn to the left of it;
                                  // the space to the right is reserved for upcoming target notes.
const FREE_VIEW_SEMITONES   = 24; // note lanes visible in Free sing mode (24 = 2 octaves)
const WARMUP_VIEW_SEMITONES = 20; // note lanes visible during a warmup. Fewer lanes = taller notes.
                                  // (a major scale spans 13 notes, so don't go much below 14)
const HIDE_READOUT_IN_WARMUP = false;  // set to true to slide the top note readout away during warmups
const LABEL_WIDTH       = 46;     // width of the note-name column on the left of the graph (px)

// --- Warmup settings ---
const LEAD_IN_BEATS     = 3;      // count-in length: "3, 2, 1" (one count per beat, with a click on each)
const GRACE_SECONDS     = 0.3;    // at the start of each note, ignore this long while you find the pitch
const REST_BEATS        = 1;      // silent gap between rounds (in beats)
const TIGHT_CENTS       = 25;     // within this many cents of the target = full points
const LOOSE_CENTS       = 50;     // within this many cents = half points, further away = 0
const METRONOME_VOLUME  = 0.2;    // metronome click loudness relative to the piano (0 = silent, 0.1 = quiet, 0.4 = loud)

// --- Song mode settings ---
const SONG_VIEW_SEMITONES  = 20;  // note lanes visible in song mode (fewer = taller note boxes)
const SONG_VISIBLE_SECONDS = 6;   // seconds of song shown across the map in song mode
const SONG_STRIP_H         = 28;  // height of the chord strip along the top of the map (px)
const SONG_LYRICS_H        = 84;  // height of the lyrics area along the bottom of the map (px)

const COLOURS = { good: '#3ddc97', ok: '#ffc857', bad: '#ff5d73', muted: '#8a92ab', line: '#6c8cff' };
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SHARP_PITCH_CLASSES = [1, 3, 6, 8, 10];   // C#, D#, F#, G#, A#

// Warmup exercises. Each note is [semitones above the root note, length in beats].
// BREATH is a rest: a gap to breathe. Scales with more than 5 notes use one between going up and coming down.
// Want to add your own? Copy a line, give it a new key and name, and edit the numbers.
const BREATH = [null, 1];     // [null, beats]: a silent pause of 1 beat
const EXERCISES = {
  five:  { name: '5-note scale (up & down)',
           notes: [[0,1],[2,1],[4,1],[5,1],[7,1],[5,1],[4,1],[2,1],[0,2]] },
  major: { name: 'Major scale (up & down)',
           notes: [[0,1],[2,1],[4,1],[5,1],[7,1],[9,1],[11,1],[12,1], BREATH,
                   [12,1],[11,1],[9,1],[7,1],[5,1],[4,1],[2,1],[0,2]] },
  minorFull: { name: 'Minor scale (up & down)',
           notes: [[0,1],[2,1],[3,1],[5,1],[7,1],[8,1],[10,1],[12,1], BREATH,
                   [12,1],[10,1],[8,1],[7,1],[5,1],[3,1],[2,1],[0,2]] },
  arp:   { name: 'Arpeggio (1-3-5-8-5-3-1)',
           notes: [[0,1],[4,1],[7,1],[12,2],[7,1],[4,1],[0,2]] },
  minor: { name: 'Minor 5-note scale',
           notes: [[0,1],[2,1],[3,1],[5,1],[7,1],[5,1],[3,1],[2,1],[0,2]] },
  long:  { name: 'Long tone (hold the root)',
           notes: [[0,8]] }
};

// Movable-do solfege names, by semitones above the root (0 = Do, 12 = Do again).
const SOLFEGE = ['Do','Ra','Re','Me','Mi','Fa','Se','Sol','Le','La','Te','Ti'];

/* =====================================================
   2. PAGE ELEMENTS
   ===================================================== */
const noteEl     = document.getElementById('note');
const freqEl     = document.getElementById('freq');
const centsEl    = document.getElementById('centsText');
const needleEl   = document.getElementById('needle');
const statusEl   = document.getElementById('status');
const btn        = document.getElementById('toggleBtn');
const gainSlider = document.getElementById('gainSlider');
const gainLabel  = document.getElementById('gainLabel');
const levelBar   = document.getElementById('levelBar');
const levelText  = document.getElementById('levelText');
const volSlider  = document.getElementById('volSlider');
const volLabel   = document.getElementById('volLabel');
const canvas     = document.getElementById('history');
const ctx2d      = canvas.getContext('2d');

const modeFreeBtn   = document.getElementById('modeFree');
const modeWarmupBtn = document.getElementById('modeWarmup');
const warmupControls = document.getElementById('warmupControls');
const exerciseSel   = document.getElementById('exerciseSel');
const rootSel       = document.getElementById('rootSel');
const roundsSel     = document.getElementById('roundsSel');
const bpmSlider     = document.getElementById('bpmSlider');
const bpmLabel      = document.getElementById('bpmLabel');
const pianoChk      = document.getElementById('pianoChk');
const octaveChk     = document.getElementById('octaveChk');
const metroChk      = document.getElementById('metroChk');
const syncSlider    = document.getElementById('syncSlider');
const syncLabel     = document.getElementById('syncLabel');
const resultsEl     = document.getElementById('results');
const resPct        = document.getElementById('resPct');
const resText       = document.getElementById('resText');
const resClose      = document.getElementById('resClose');

const modeSongBtn   = document.getElementById('modeSong');
const songControls  = document.getElementById('songControls');
const songSel       = document.getElementById('songSel');
const speedSlider   = document.getElementById('speedSlider');
const speedLabel    = document.getElementById('speedLabel');
const keyLabel      = document.getElementById('keyLabel');
const keyDownBtn    = document.getElementById('keyDown');
const keyUpBtn      = document.getElementById('keyUp');
const melSlider     = document.getElementById('melSlider');
const melLabel      = document.getElementById('melLabel');

/* =====================================================
   3. MUSIC MATHS
   ===================================================== */
// Frequency (Hz) -> MIDI note number as a decimal. A4 = 440Hz = MIDI 69.
function freqToMidi(freq) {
  return 69 + 12 * Math.log2(freq / 440);
}
// MIDI note number -> frequency (Hz)
function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}
// MIDI number -> name like "B3"
function midiToName(midi) {
  const n = Math.round(midi);
  const name = NOTE_NAMES[((n % 12) + 12) % 12];
  const octave = Math.floor(n / 12) - 1;   // MIDI 60 = C4
  return name + octave;
}

/* =====================================================
   4. PITCH DETECTION (YIN algorithm)
   Finds the repeating period of the sound wave.
   Frequency = sampleRate / period.
   ===================================================== */
let lastRms = 0;    // latest loudness (average), shown on the mic level bar
let lastPeak = 0;   // latest loudest single sample – if this hits ~1 the sound is clipping (too loud)
function detectPitch(buffer, sampleRate) {
  // Volume check (RMS = average loudness)
  let sumSquares = 0;
  let peak = 0;
  for (let i = 0; i < buffer.length; i++) {
    sumSquares += buffer[i] * buffer[i];
    const a = Math.abs(buffer[i]);
    if (a > peak) peak = a;
  }
  const rms = Math.sqrt(sumSquares / buffer.length);
  lastRms = rms;
  lastPeak = peak;
  if (rms < VOLUME_GATE) return -1;

  const windowSize = Math.floor(buffer.length / 2);
  const minTau = Math.floor(sampleRate / MAX_FREQ);
  const maxTau = Math.min(windowSize - 1, Math.floor(sampleRate / MIN_FREQ));

  // Step 1: difference function – how different is the wave from a shifted copy of itself?
  const diff = new Float32Array(maxTau + 1);
  for (let tau = 1; tau <= maxTau; tau++) {
    let sum = 0;
    for (let i = 0; i < windowSize; i++) {
      const delta = buffer[i] - buffer[i + tau];
      sum += delta * delta;
    }
    diff[tau] = sum;
  }

  // Step 2: normalise it (cumulative mean) so thresholds work at any volume
  const cmnd = new Float32Array(maxTau + 1);
  cmnd[0] = 1;
  let runningSum = 0;
  for (let tau = 1; tau <= maxTau; tau++) {
    runningSum += diff[tau];
    cmnd[tau] = diff[tau] * tau / runningSum;
  }

  // Step 3: find the first dip below the threshold
  let tauEstimate = -1;
  for (let tau = minTau; tau <= maxTau; tau++) {
    if (cmnd[tau] < YIN_THRESHOLD) {
      while (tau + 1 <= maxTau && cmnd[tau + 1] < cmnd[tau]) tau++;   // walk to the bottom of the dip
      tauEstimate = tau;
      break;
    }
  }
  if (tauEstimate === -1) return -1;   // no clear pitch (breathy / noisy)

  // Step 4: refine between samples (parabolic interpolation)
  const x0 = tauEstimate > 1 ? tauEstimate - 1 : tauEstimate;
  const x2 = tauEstimate + 1 <= maxTau ? tauEstimate + 1 : tauEstimate;
  let betterTau = tauEstimate;
  if (x0 !== tauEstimate && x2 !== tauEstimate) {
    const s0 = cmnd[x0], s1 = cmnd[tauEstimate], s2 = cmnd[x2];
    const denom = 2 * (2 * s1 - s2 - s0);
    if (denom !== 0) betterTau = tauEstimate + (s2 - s0) / denom;
  }
  return sampleRate / betterTau;
}

/* =====================================================
   5. SMOOTHING
   - recentMidi / smoothMidi: median of the last few readings (removes one-frame glitches).
     This is what the graph line uses, so it stays responsive.
   - displayMidi: a slower moving average used for the big note name, cents number and colour,
     so they don't flicker when your voice naturally wobbles by a few cents.
   ===================================================== */
const recentMidi = [];
function smoothMidi(midi) {
  recentMidi.push(midi);
  if (recentMidi.length > 5) recentMidi.shift();
  const sorted = [...recentMidi].sort((a, b) => a - b);
  return sorted[Math.floor(sorted.length / 2)];
}

let displayMidi = null;   // slow-moving value for the readout (null = nothing being sung)
function updateDisplayMidi(midi) {
  // If the pitch jumps a long way (new note), snap straight to it instead of sliding
  if (displayMidi === null || Math.abs(midi - displayMidi) > 1.5) {
    displayMidi = midi;
  } else {
    displayMidi += (midi - displayMidi) * DISPLAY_SMOOTHING;
  }
}

/* =====================================================
   6. MICROPHONE + MAIN LOOP
   ===================================================== */
let audioCtx = null;
let gainNode = null;
let analyser = null;
let stream = null;
let running = false;
let rafId = null;
let timeBuffer = null;
let silentFrames = 0;
let lastFrameTime = 0;
const history = [];   // { t: time in ms, midi: number or null }

let viewCenter = 57;  // the note (MIDI number) at the vertical middle of the graph. 57 = A3.
                      // In free mode it follows your voice; in warmup mode it follows the target notes.

let viewSemitones = FREE_VIEW_SEMITONES;   // how many note lanes are on screen right now
let visibleSeconds = FREE_VISIBLE_SECONDS; // how many seconds of time are across the graph right now
let lastDrawNow = 0;  // the last time value passed to drawGraph (used to redraw when the layout changes)

let mode = 'free';    // 'free' or 'warmup'
let warmup = null;    // the running warmup (null when none is running)
let pianoBus = null;  // volume control that all piano notes go through
let clickBus = null;  // volume control for the metronome clicks
let backBus = null;   // volume control for the song's backing track
let songKeyShift = 0; // song mode: how many semitones the key is shifted (-6 to +6)
let flatLabels = false;   // true while a song in a "flat" key (Bb, Eb...) is running, so the side labels say Bb not A#

// Name for a note lane on the left of the map (follows flatLabels)
function laneLabel(n) {
  const names = flatLabels ? FLAT_NAMES : NOTE_NAMES;
  return names[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
}

async function start() {
  try {
    // Turn OFF the phone's voice processing – it distorts pitch.
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (err) {
    statusEl.textContent = 'Microphone blocked or unavailable: ' + err.message;
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();   // mobile browsers often start audio "suspended"
  const source = audioCtx.createMediaStreamSource(stream);

  // Software volume boost: the phone mic is quiet with its auto-gain turned off
  gainNode = audioCtx.createGain();
  gainNode.gain.value = Number(gainSlider.value);

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = FFT_SIZE;
  source.connect(gainNode);
  gainNode.connect(analyser);
  timeBuffer = new Float32Array(analyser.fftSize);

  running = true;
  lastFrameTime = 0;
  refreshButton();
  statusEl.textContent = 'Listening… sing a sustained "ah".';
  loop();
}

function stop() {
  running = false;
  cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  statusEl.textContent = 'Stopped.';
  displayMidi = null;
  refreshButton();
  showNothing();
}

function loop() {
  if (!running) return;

  analyser.getFloatTimeDomainData(timeBuffer);
  const freq = detectPitch(timeBuffer, audioCtx.sampleRate);

  // Level meter in decibels: empty = -60 dB, full = 0 dB. Red = too loud (clipping).
  const db = lastRms > 0 ? 20 * Math.log10(lastRms) : -100;
  const tooLoud = lastPeak >= 0.98;
  levelBar.style.width = Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + '%';
  levelBar.style.background = tooLoud ? COLOURS.bad : COLOURS.line;
  levelText.textContent = 'mic ' + Math.round(db) + ' dB' + (tooLoud ? ' – TOO LOUD, lower the mic boost' : '');

  const now = performance.now();
  const dt = lastFrameTime ? Math.min(now - lastFrameTime, 100) : 16;   // ms since the last frame
  lastFrameTime = now;

  // --- warmup: which target note (if any) should be sung right now? ---
  let target = null;
  if (warmup) {
    if (now > warmup.endMs) { finishWarmup(); return; }
    const t = targetsAt(now);
    target = t.current;
    const focus = t.current || t.next;
    if (focus) followVoice(focus.midi);     // keep the target notes in view

    const secondsToStart = (warmup.notes[0].startMs - now) / 1000;
    if (secondsToStart > 0) {
      const count = Math.ceil(secondsToStart / (warmup.beatMs / 1000));
      statusEl.textContent = count > LEAD_IN_BEATS
        ? 'Get ready…'
        : 'Get ready… ' + count + '  (reference note: ' + midiToName(warmup.notes[0].midi) + ')';
    } else if (target) {
      statusEl.textContent = warmup.song
        ? '♪ ' + warmup.song.title + ' · ' + warmup.song.speedPct + '% · key ' + warmup.song.keyName
        : 'Round ' + (target.round + 1) + ' of ' + warmup.rounds + ' – sing ' + target.label + ' (' + midiToName(target.midi) + ')';
    }
  }

  // --- pitch detection result ---
  let plotMidi = null;      // the pitch we draw on the graph
  if (freq > 0) {
    const raw = smoothMidi(freqToMidi(freq));
    updateDisplayMidi(raw);
    showPitch(freq);
    plotMidi = raw;
    // "Any octave": if you sing the right note in a different octave, draw it on the target's octave
    if (target && warmup.anyOctave) plotMidi = raw + 12 * Math.round((target.midi - raw) / 12);
    if (!warmup) followVoice(raw);
    silentFrames = 0;
  } else {
    recentMidi.length = 0;
    silentFrames++;
    // Only blank the readout after ~8 silent frames, so tiny dropouts don't make it flash
    if (silentFrames > 8) { displayMidi = null; showNothing(); }
  }
  history.push({ t: now, midi: plotMidi });

  // --- warmup scoring ---
  // (in songs the grace period is shortened for short notes, so quick notes still get scored)
  const graceMs = (target && warmup.song)
    ? Math.min(GRACE_SECONDS * 1000, (target.endMs - target.startMs) * 0.35)
    : GRACE_SECONDS * 1000;
  if (target && now >= target.startMs + graceMs) {
    target.total += dt;                                     // time we were "supposed" to be singing
    if (plotMidi !== null) {
      const diffCents = (plotMidi - target.midi) * 100;     // + = sharp, - = flat
      const abs = Math.abs(diffCents);
      target.score += dt * (abs <= TIGHT_CENTS ? 1 : abs <= LOOSE_CENTS ? 0.5 : 0);
      target.signed += diffCents * dt;
      target.voiced += dt;
    }
  }

  // drop history older than the window
  const cutoff = now - visibleSeconds * NOW_POSITION * 1000;
  while (history.length && history[0].t < cutoff) history.shift();

  drawGraph(now);
  rafId = requestAnimationFrame(loop);
}

/* =====================================================
   7. READOUT (top box)
   ===================================================== */
function colourForCents(absCents) {
  return absCents <= IN_TUNE_CENTS ? COLOURS.good
       : absCents <= CLOSE_CENTS   ? COLOURS.ok
       :                             COLOURS.bad;
}

function showPitch(freq) {
  const nearest = Math.round(displayMidi);
  const cents = (displayMidi - nearest) * 100;     // -50 to +50
  const colour = colourForCents(Math.abs(cents));

  noteEl.textContent = midiToName(displayMidi);
  freqEl.textContent = freq.toFixed(1) + ' Hz';
  centsEl.textContent = (cents >= 0 ? '+' : '') + cents.toFixed(0) + ' cents';
  noteEl.style.color = colour;
  needleEl.style.background = colour;
  needleEl.style.left = (50 + cents) + '%';        // -50..+50 cents -> 0..100%
}

function showNothing() {
  noteEl.textContent = '–';
  noteEl.style.color = COLOURS.muted;
  freqEl.textContent = running ? 'Listening…' : 'Press Start and sing a note';
  centsEl.textContent = '';
  needleEl.style.left = '50%';
  needleEl.style.background = COLOURS.muted;
}

/* =====================================================
   8. GRAPH (piano-roll style, one lane per note)
   ===================================================== */
// Slide the visible note range up/down when a note gets near its edge.
function followVoice(midi) {
  const margin = viewSemitones / 2 - 2;            // how far from centre before we start scrolling
  if (midi > viewCenter + margin)      viewCenter += (midi - (viewCenter + margin)) * 0.1;
  else if (midi < viewCenter - margin) viewCenter += (midi - (viewCenter - margin)) * 0.1;
}

// Draws a rounded rectangle path (falls back to a plain rectangle on older browsers)
function roundedRect(x, y, w, h, r) {
  ctx2d.beginPath();
  if (ctx2d.roundRect) ctx2d.roundRect(x, y, w, h, r);
  else ctx2d.rect(x, y, w, h);
}

function drawGraph(now) {
  // Match the canvas pixel size to its on-screen size (sharp on high-res phone screens)
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx2d.clearRect(0, 0, w, h);

  lastDrawNow = now;
  const lowMidi  = viewCenter - viewSemitones / 2;
  const highMidi = viewCenter + viewSemitones / 2;
  // In song mode the note lanes sit between the chord strip (top) and the lyrics (bottom)
  const song = warmup ? warmup.song : null;
  const topPad = song ? SONG_STRIP_H : 0;
  const bottomPad = song ? SONG_LYRICS_H : 0;
  const laneAreaH = h - topPad - bottomPad;
  const yFor = m => topPad + (1 - (m - lowMidi) / (highMidi - lowMidi)) * laneAreaH;   // note number -> pixel row
  const plotLeft = LABEL_WIDTH;
  const plotWidth = w - plotLeft;

  // Which lane to highlight: the target note during a warmup, otherwise the note you're singing
  const activeTarget = warmup ? targetsAt(now).current : null;
  let activeNote = null;
  if (warmup) {
    // during the count-in, highlight the first note (that's the reference note you hear)
    const beforeStart = now < warmup.notes[0].startMs;
    activeNote = activeTarget ? activeTarget.midi : (beforeStart ? warmup.notes[0].midi : null);
  }
  else if (displayMidi !== null) activeNote = Math.round(displayMidi);

  // Time -> horizontal position. "now" sits partway across; the past scrolls off to the left.
  const nowX = plotLeft + plotWidth * NOW_POSITION;
  const pxPerSec = plotWidth / visibleSeconds;

  // --- note lanes: each note owns a band centred on its exact pitch ---
  ctx2d.textBaseline = 'middle';
  for (let n = Math.floor(lowMidi) - 1; n <= Math.ceil(highMidi) + 1; n++) {
    const top = yFor(n + 0.5), bottom = yFor(n - 0.5);
    const pitchClass = ((n % 12) + 12) % 12;
    const isSharp = SHARP_PITCH_CLASSES.includes(pitchClass);

    // lane background (sharps/flats darker, like piano black keys)
    ctx2d.fillStyle = isSharp ? '#131724' : '#1b2033';
    ctx2d.fillRect(plotLeft, top, plotWidth, bottom - top);

    // highlight the active lane
    if (n === activeNote) {
      ctx2d.fillStyle = 'rgba(108,140,255,0.22)';
      ctx2d.fillRect(plotLeft, top, plotWidth, bottom - top);
    }

    // line between lanes (brighter at each C, where an octave starts)
    ctx2d.strokeStyle = pitchClass === 0 ? '#3b4366' : '#262c44';
    ctx2d.lineWidth = 1;
    ctx2d.beginPath();
    ctx2d.moveTo(plotLeft, bottom);
    ctx2d.lineTo(w, bottom);
    ctx2d.stroke();

    // note-name label in the left column
    const yMid = (top + bottom) / 2;
    ctx2d.fillStyle = isSharp ? '#0f121c' : '#222842';
    ctx2d.fillRect(0, top, plotLeft - 2, bottom - top);
    ctx2d.fillStyle = n === activeNote ? '#ffffff' : (pitchClass === 0 ? '#c8cfee' : '#7e87a8');
    ctx2d.font = (pitchClass === 0 || n === activeNote ? 'bold ' : '') + '11px system-ui';
    ctx2d.textAlign = 'right';
    ctx2d.fillText(laneLabel(n), plotLeft - 8, yMid);
  }

  // Song mode: backgrounds for the chord strip and lyrics (these also hide the lane edges)
  if (song) {
    ctx2d.fillStyle = '#151a2b';
    ctx2d.fillRect(0, 0, w, topPad);
    ctx2d.fillStyle = '#10131d';
    ctx2d.fillRect(0, h - bottomPad, w, bottomPad);
    ctx2d.strokeStyle = '#2a3048';
    ctx2d.lineWidth = 1;
    ctx2d.beginPath();
    ctx2d.moveTo(0, topPad + 0.5);
    ctx2d.lineTo(w, topPad + 0.5);
    ctx2d.moveTo(0, h - bottomPad + 0.5);
    ctx2d.lineTo(w, h - bottomPad + 0.5);
    ctx2d.stroke();
  }

  // Everything below is clipped to the lane area so bars/lines don't spill over the note labels
  ctx2d.save();
  ctx2d.beginPath();
  ctx2d.rect(plotLeft, topPad, plotWidth, laneAreaH);
  ctx2d.clip();

  // --- warmup target notes: bars that scroll in from the right ---
  if (warmup) {
    const laneH = laneAreaH / viewSemitones;
    const barH = laneH * 0.78;

    for (const n of warmup.notes) {
      const x1 = nowX + ((n.startMs - now) / 1000) * pxPerSec + 2;
      const x2 = nowX + ((n.endMs - now) / 1000) * pxPerSec - 2;
      if (x2 < plotLeft || x1 > w) continue;                       // off screen
      const yc = yFor(n.midi);
      const isCurrent = now >= n.startMs && now < n.endMs;

      let fill;
      if (now >= n.endMs) {
        // finished: colour shows how well you did on this note
        const acc = n.total > 0 ? n.score / n.total : 0;
        fill = acc >= 0.75 ? COLOURS.good : acc >= 0.4 ? COLOURS.ok : COLOURS.bad;
      } else if (isCurrent) {
        fill = '#9db4ff';
      } else {
        fill = 'rgba(108,140,255,0.6)';
      }
      ctx2d.fillStyle = fill;
      roundedRect(x1, yc - barH / 2, Math.max(2, x2 - x1), barH, 5);
      ctx2d.fill();
      if (isCurrent) {
        ctx2d.strokeStyle = '#ffffff';
        ctx2d.lineWidth = 2;
        ctx2d.stroke();
      }

      // what to sing, inside the bar: the solfege name (Do, Re, Mi...), plus the note name if there's room
      const boxW = x2 - x1;
      if (boxW > 14) {
        // start at a nice size, shrink the text if the box is too narrow for it
        let fs = Math.round(Math.max(11, Math.min(20, barH * 0.55)));
        ctx2d.font = 'bold ' + fs + 'px system-ui';
        while (fs > 8 && ctx2d.measureText(n.label).width > boxW - 10) {
          fs--;
          ctx2d.font = 'bold ' + fs + 'px system-ui';
        }
        const labelW = ctx2d.measureText(n.label).width;
        ctx2d.fillStyle = '#0d1020';
        ctx2d.textAlign = 'left';
        ctx2d.fillText(n.label, Math.max(x1, plotLeft) + 6, yc);
        // note name too (e.g. E4), if the box is long enough to hold both
        // (song notes set sub to '' because their label already IS the note name)
        const rightText = (n.sub !== undefined) ? n.sub : midiToName(n.midi);
        if (rightText && boxW > labelW + 56) {
          ctx2d.font = '11px system-ui';
          ctx2d.textAlign = 'right';
          ctx2d.fillStyle = 'rgba(13,16,32,0.7)';
          ctx2d.fillText(rightText, x2 - 6, yc);
        }
      }
    }

    // big countdown number (3, 2, 1) before the first note – one number per beat
    const secondsToStart = (warmup.notes[0].startMs - now) / 1000;
    if (secondsToStart > 0) {
      const count = Math.ceil(secondsToStart / (warmup.beatMs / 1000));
      if (count <= LEAD_IN_BEATS) {
        ctx2d.fillStyle = 'rgba(242,244,250,0.85)';
        ctx2d.font = 'bold 64px system-ui';
        ctx2d.textAlign = 'center';
        ctx2d.fillText(String(count), plotLeft + plotWidth * 0.6, topPad + laneAreaH / 2);
      }
    }
  }

  // --- the "now" line: target notes scroll in from the right and reach this line ---
  ctx2d.strokeStyle = 'rgba(242,244,250,0.55)';
  ctx2d.lineWidth = 2;
  ctx2d.beginPath();
  ctx2d.moveTo(nowX, 0);
  ctx2d.lineTo(nowX, h);
  ctx2d.stroke();

  // --- your pitch as a line ---
  ctx2d.strokeStyle = COLOURS.line;
  ctx2d.lineWidth = 3;
  ctx2d.lineCap = 'round';
  ctx2d.lineJoin = 'round';
  ctx2d.beginPath();
  let penDown = false;
  let lastX = 0, lastY = 0, lastPoint = null;
  for (const p of history) {
    if (p.midi === null) { penDown = false; continue; }
    const x = nowX - ((now - p.t) / 1000) * pxPerSec;
    const y = yFor(p.midi);
    if (!penDown) { ctx2d.moveTo(x, y); penDown = true; }
    else ctx2d.lineTo(x, y);
    lastX = x; lastY = y; lastPoint = p;
  }
  ctx2d.stroke();

  // --- coloured dot at the "now" end of the line ---
  // colour = how close you are to the target (warmup) or to the nearest note (free mode)
  if (lastPoint && now - lastPoint.t < 150) {
    let cents = null;
    if (warmup && activeTarget) cents = Math.abs(lastPoint.midi - activeTarget.midi) * 100;
    else if (!warmup && displayMidi !== null) cents = Math.abs(displayMidi - Math.round(displayMidi)) * 100;
    ctx2d.fillStyle = cents === null ? COLOURS.line : colourForCents(cents);
    ctx2d.beginPath();
    ctx2d.arc(lastX, lastY, 6, 0, Math.PI * 2);
    ctx2d.fill();
  }

  ctx2d.restore();

  // Song mode: chords across the top, lyrics along the bottom
  if (song) {
    drawChordStrip(now, w, plotLeft, plotWidth, nowX, pxPerSec, topPad);
    drawLyrics(now, w, h, bottomPad);
  }
}

/* =====================================================
   9. WARMUP MODE
   ===================================================== */
// Finds the note being sung right now, and the next one coming up
function targetsAt(now) {
  let current = null, next = null;
  for (const n of warmup.notes) {
    if (now >= n.startMs && now < n.endMs) { current = n; break; }
    if (n.startMs > now) { next = n; break; }
  }
  return { current, next };
}

// A simple piano-ish sound: a few sine waves (harmonics) with a quick attack and a slow fade
function playPianoNote(freq, when, dur) {
  const partials = [[1, 1.0], [2, 0.5], [3, 0.28], [4, 0.14], [5, 0.07]];   // [multiple of base freq, loudness]
  const norm = partials.reduce((sum, p) => sum + p[1], 0);
  const peak = 0.5;                                                        // loudness of the piano (before the Guide volume slider)

  const env = audioCtx.createGain();
  env.gain.setValueAtTime(0.0001, when);
  env.gain.exponentialRampToValueAtTime(peak, when + 0.015);               // quick attack
  env.gain.exponentialRampToValueAtTime(peak * 0.4, when + Math.max(dur, 0.1));   // slow fade while held
  env.gain.exponentialRampToValueAtTime(0.0001, when + dur + 0.15);        // release
  env.connect(pianoBus);

  for (const [mult, amp] of partials) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * mult;
    g.gain.value = amp / norm;
    osc.connect(g);
    g.connect(env);
    osc.start(when);
    osc.stop(when + dur + 0.2);
  }
}

// A short, quiet metronome tick (pitched above the singing range so the pitch detector ignores it)
function playClick(when, accent) {
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const vol = METRONOME_VOLUME * (accent ? 1.4 : 1);       // first beat of each round is a bit louder
  osc.type = 'sine';
  osc.frequency.value = accent ? 2000 : 1500;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 0.05);
  osc.connect(g);
  g.connect(clickBus);
  osc.start(when);
  osc.stop(when + 0.06);
}

// How late (in ms) the phone's audio output is, if the browser will tell us
function autoSyncMs() {
  return ((audioCtx.outputLatency || 0) + (audioCtx.baseLatency || 0)) * 1000;
}

// All guide sounds (piano + metronome) go through one volume control and a limiter,
// so the Guide volume slider can go loud without crackling.
let outBus = null;
function getOutBus() {
  if (!outBus) {
    outBus = audioCtx.createGain();
    outBus.gain.value = Number(volSlider.value) / 100;
    const limiter = audioCtx.createDynamicsCompressor();
    limiter.threshold.value = -6;
    limiter.knee.value = 0;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.002;
    limiter.release.value = 0.1;
    outBus.connect(limiter);
    limiter.connect(audioCtx.destination);
  }
  return outBus;
}

// Silence any piano notes and clicks that haven't played yet
function endPiano() {
  for (const bus of [pianoBus, clickBus, backBus, outBus]) {
    if (bus) {
      try {
        bus.gain.cancelScheduledValues(0);
        bus.gain.value = 0;
        bus.disconnect();
      } catch (e) {}
    }
  }
  pianoBus = null;
  clickBus = null;
  backBus = null;
  outBus = null;
}

function beginWarmup() {
  const exercise = EXERCISES[exerciseSel.value];
  const root = Number(rootSel.value);
  const rounds = Number(roundsSel.value);
  const beatMs = 60000 / Number(bpmSlider.value);
  const leadMs = LEAD_IN_BEATS * beatMs;                       // length of the "3, 2, 1" count-in
  const startDelay = 0.1;                                      // seconds; so nothing gets scheduled in the past
  const syncMs = autoSyncMs() + Number(syncSlider.value);      // how late sound is heard after it's scheduled
  // Times on the screen's clock. The bars are delayed by syncMs so they line up with what you HEAR.
  const t0 = performance.now() + startDelay * 1000 + leadMs + syncMs;   // when the first note is heard
  // The same moment on the audio clock (used to schedule the piano and clicks)
  const audioT0 = audioCtx.currentTime + startDelay + leadMs / 1000;

  // Build the full list of target notes, with start/end times
  const notes = [];
  const rests = [];                          // gaps to breathe in (shown on the graph, no scoring)
  let cursor = t0;
  for (let r = 0; r < rounds; r++) {
    for (const [semitones, beats] of exercise.notes) {
      if (semitones === null) {              // a breath: leave a gap
        rests.push({ startMs: cursor, endMs: cursor + beats * beatMs });
        cursor += beats * beatMs;
        continue;
      }
      notes.push({
        midi: root + r + semitones,        // each round starts 1 semitone higher
        label: SOLFEGE[((semitones % 12) + 12) % 12],
        startMs: cursor,
        endMs: cursor + beats * beatMs,
        round: r,
        score: 0, total: 0, signed: 0, voiced: 0
      });
      cursor += beats * beatMs;
    }
    if (r < rounds - 1) rests.push({ startMs: cursor, endMs: cursor + REST_BEATS * beatMs });
    cursor += REST_BEATS * beatMs;           // short rest between rounds
  }

  warmup = {
    notes: notes,
    rests: rests,
    rounds: rounds,
    beatMs: beatMs,
    anyOctave: octaveChk.checked,
    endMs: notes[notes.length - 1].endMs + 600
  };

  history.length = 0;
  viewSemitones = WARMUP_VIEW_SEMITONES;      // fewer lanes = taller notes
  visibleSeconds = WARMUP_VISIBLE_SECONDS;    // fewer seconds = longer boxes, faster scroll
  viewCenter = root + 5 + (rounds - 1) / 2;   // start with the notes in view

  // Schedule the sounds on the audio clock so the timing is precise
  if (pianoChk.checked) {
    pianoBus = audioCtx.createGain();
    pianoBus.gain.value = 1;
    pianoBus.connect(getOutBus());
    // reference note: the first note of the exercise is held during the count-in
    playPianoNote(midiToFreq(notes[0].midi), audioT0 - leadMs / 1000, Math.max(0.3, leadMs / 1000 - 0.1));
    for (const n of notes) {
      const when = audioT0 + (n.startMs - t0) / 1000;
      playPianoNote(midiToFreq(n.midi), when, (n.endMs - n.startMs) / 1000);
    }
  }

  if (metroChk.checked && METRONOME_VOLUME > 0) {
    clickBus = audioCtx.createGain();
    clickBus.gain.value = 1;
    clickBus.connect(getOutBus());
    // clicks during the count-in
    for (let k = 1; k <= LEAD_IN_BEATS; k++) {
      playClick(audioT0 - (k * beatMs) / 1000, false);
    }
    // clicks through each round (louder on the first beat of a round)
    for (let r = 0; r < rounds; r++) {
      const roundNotes = notes.filter(n => n.round === r);
      const roundStart = roundNotes[0].startMs;
      const roundEnd = roundNotes[roundNotes.length - 1].endMs + (r < rounds - 1 ? REST_BEATS * beatMs : 0);
      for (let b = 0; roundStart + b * beatMs < roundEnd - 1; b++) {
        playClick(audioT0 + (roundStart + b * beatMs - t0) / 1000, b === 0);
      }
    }
  }

  setModeButtonsEnabled(false);
  setPanelsCollapsed(true);                   // settings slide away; only the map + Stop button remain
  refreshButton();
}

// Slides the settings down (and the top readout up) out of view, or brings them back
function setPanelsCollapsed(collapsed) {
  document.getElementById('settingsWrap').classList.toggle('collapsed', collapsed);
  if (HIDE_READOUT_IN_WARMUP) document.getElementById('topWrap').classList.toggle('collapsed', collapsed);
}

function cancelWarmup() {
  const wasSong = warmup && warmup.song;
  warmup = null;
  flatLabels = false;
  endPiano();
  stop();
  setModeButtonsEnabled(true);
  setPanelsCollapsed(false);
  viewSemitones = FREE_VIEW_SEMITONES;
  visibleSeconds = FREE_VISIBLE_SECONDS;
  statusEl.textContent = wasSong ? 'Song stopped.' : 'Warmup stopped.';
}

function finishWarmup() {
  const w = warmup;
  warmup = null;
  flatLabels = false;
  endPiano();
  stop();
  setModeButtonsEnabled(true);
  setPanelsCollapsed(false);
  viewSemitones = FREE_VIEW_SEMITONES;
  visibleSeconds = FREE_VISIBLE_SECONDS;
  statusEl.textContent = w.song ? 'Song complete.' : 'Warmup complete.';
  document.getElementById('resTitle').textContent = w.song ? 'Song complete' : 'Warmup complete';

  // Add everything up
  let score = 0, total = 0, signed = 0, voiced = 0;
  const byNote = {};                       // totals per note name, e.g. "E4"
  for (const n of w.notes) {
    score += n.score; total += n.total; signed += n.signed; voiced += n.voiced;
    const name = midiToName(n.midi);
    if (!byNote[name]) byNote[name] = { score: 0, total: 0 };
    byNote[name].score += n.score;
    byNote[name].total += n.total;
  }
  const pct = total > 0 ? Math.round(100 * score / total) : 0;

  const lines = [];
  const names = Object.keys(byNote).filter(k => byNote[k].total > 0);
  if (names.length > 1 && voiced > 0) {
    names.sort((a, b) => byNote[b].score / byNote[b].total - byNote[a].score / byNote[a].total);
    const best = names[0], worst = names[names.length - 1];
    lines.push('Best note: <b>' + best + '</b> (' + Math.round(100 * byNote[best].score / byNote[best].total) + '%)');
    lines.push('Weakest note: <b>' + worst + '</b> (' + Math.round(100 * byNote[worst].score / byNote[worst].total) + '%)');
  }
  if (voiced > 0) {
    const avg = signed / voiced;
    if (Math.abs(avg) < 8) lines.push('On average you were right on the pitch.');
    else lines.push('On average you were about <b>' + Math.round(Math.abs(avg)) + ' cents ' + (avg > 0 ? 'sharp' : 'flat') + '</b>.');
  } else {
    lines.push('No singing was detected. Check the mic boost and try again.');
  }

  resPct.textContent = pct + '%';
  resPct.style.color = pct >= 80 ? COLOURS.good : pct >= 55 ? COLOURS.ok : COLOURS.bad;
  resText.innerHTML = lines.map(l => '<div>' + l + '</div>').join('');
  resultsEl.hidden = false;
}

/* =====================================================
   9b. SONG MODE
   ===================================================== */
// A song is a plain JS object. Later we'll load these from .json files made by a Python script,
// so this is the "song file format". All times are in SECONDS, at 100% speed, in the key it was written in:
//
//   { id, title, bpm, beatsPerBar,
//     keyTonic: 0..11 (0 = C, 1 = C#, ... 11 = B),  keyMode: 'major' or 'minor',
//     duration,
//     notes:  [{ t, d, midi }, ...]                      the melody (t = start time, d = length)
//     chords: [{ t, d, name }, ...]                      e.g. 'Am', 'C', 'G7', 'F/A'
//     lyrics: [{ t, text, words: [{ t, text }, ...] }]   one entry per line; "words" is optional }

const FLAT_NAMES = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

function wrap12(n) { return ((Math.round(n) % 12) + 12) % 12; }

// 'C' -> 0, 'F#' -> 6, 'Bb' -> 10
function parsePc(name) {
  let pc = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[name[0]];
  if (name[1] === '#') pc += 1;
  else if (name[1] === 'b') pc -= 1;
  return wrap12(pc);
}
// 'C4' -> 60, 'A4' -> 69
function noteNameToMidi(name) {
  const m = /^([A-G][#b]?)(-?\d+)$/.exec(name);
  return (Number(m[2]) + 1) * 12 + parsePc(m[1]);
}

// Should note names in this key use flats (Bb, Eb...) rather than sharps?
function usesFlats(tonicPc, mode) {
  const flatMajorKeys = [5, 10, 3, 8, 1, 6];   // F, Bb, Eb, Ab, Db, Gb
  const flatMinorKeys = [2, 7, 0, 5, 10, 3];   // Dm, Gm, Cm, Fm, Bbm, Ebm
  return (mode === 'minor' ? flatMinorKeys : flatMajorKeys).includes(tonicPc);
}

// Moves a chord name up/down by some semitones: transposeChord('Am7', 2, false) -> 'Bm7'
function transposeChord(name, semis, preferFlats) {
  const m = /^([A-G][#b]?)(.*?)(?:\/([A-G][#b]?))?$/.exec(name);
  if (!m) return name;
  const names = preferFlats ? FLAT_NAMES : NOTE_NAMES;
  const move = n => names[wrap12(parsePc(n) + semis)];
  return move(m[1]) + m[2] + (m[3] ? '/' + move(m[3]) : '');
}

// Works out which notes a chord name contains: { rootPc, tones: [semitones above the root] }
function chordInfo(name) {
  const m = /^([A-G][#b]?)(.*?)(?:\/.*)?$/.exec(name);
  const suffix = m ? m[2] : '';
  let third = 4, fifth = 7, extra = null;
  if (/^(m(?!aj)|min|-)/.test(suffix)) third = 3;
  if (/dim/.test(suffix)) { third = 3; fifth = 6; }
  if (/aug|\+/.test(suffix)) fifth = 8;
  if (/sus4/.test(suffix)) third = 5;
  if (/sus2/.test(suffix)) third = 2;
  if (/maj7|M7/.test(suffix)) extra = 11;
  else if (/7/.test(suffix)) extra = 10;
  const tones = [0, third, fifth];
  if (extra !== null) tones.push(extra);
  return { rootPc: m ? parsePc(m[1]) : 0, tones };
}

function keyNameFor(song, semis) {
  const pc = wrap12(song.keyTonic + semis);
  return (usesFlats(pc, song.keyMode) ? FLAT_NAMES : NOTE_NAMES)[pc] + ' ' + song.keyMode;
}

// ---- The built-in test tune: "Twinkle, Twinkle, Little Star" (public domain) ----
function buildTwinkle() {
  const bpm = 100;
  const beat = 60 / bpm;                                  // seconds per beat

  // The melody: [note, beats, syllable]. A syllable ending in "-" joins on to the next one (same word).
  const verse = [
    ['C4',1,'Twin-'],['C4',1,'kle,'],['G4',1,'twin-'],['G4',1,'kle,'],['A4',1,'lit-'],['A4',1,'tle'],['G4',2,'star,'],
    ['F4',1,'How'],['F4',1,'I'],['E4',1,'won-'],['E4',1,'der'],['D4',1,'what'],['D4',1,'you'],['C4',2,'are!'],
    ['G4',1,'Up'],['G4',1,'a-'],['F4',1,'bove'],['F4',1,'the'],['E4',1,'world'],['E4',1,'so'],['D4',2,'high,'],
    ['G4',1,'Like'],['G4',1,'a'],['F4',1,'dia-'],['F4',1,'mond'],['E4',1,'in'],['E4',1,'the'],['D4',2,'sky.']
  ];
  const tune = verse.concat(verse.slice(0, 14));          // then the first two lines again

  const notes = [];
  let cursor = 0;                                         // position in beats
  for (const [name, beats, syl] of tune) {
    notes.push({ t: cursor * beat, d: beats * beat, midi: noteNameToMidi(name), syl: syl });
    cursor += beats;
  }

  // Lyrics: every line is 7 notes. Each word starts when its first syllable starts.
  const lyrics = [];
  for (let i = 0; i < notes.length; i += 7) {
    const group = notes.slice(i, i + 7);
    const words = [];
    let cur = null;
    for (const n of group) {
      if (!cur) cur = { t: n.t, text: '' };
      cur.text += n.syl.replace(/-$/, '');
      if (!n.syl.endsWith('-')) { words.push(cur); cur = null; }
    }
    lyrics.push({ t: group[0].t, text: words.map(wd => wd.text).join(' '), words: words });
  }

  // Chords: one chord per half-bar (2 beats); neighbours that match get merged into one long chord
  const halfBars = ['C','C','F','C','F','C','G','C','C','F','C','G','C','F','C','G','C','C','F','C','F','C','G','C'];
  const chords = [];
  halfBars.forEach((name, i) => {
    const last = chords[chords.length - 1];
    if (last && last.name === name) last.d += 2 * beat;
    else chords.push({ t: i * 2 * beat, d: 2 * beat, name: name });
  });

  return {
    id: 'twinkle', title: 'Twinkle, Twinkle, Little Star (test tune)',
    bpm: bpm, beatsPerBar: 4, keyTonic: 0, keyMode: 'major',
    duration: cursor * beat, notes: notes, chords: chords, lyrics: lyrics
  };
}

const SONGS = { twinkle: buildTwinkle() };

// ---- Synthesised backing track (until we load real audio): bass + a gently plucked chord pattern ----
function playPluck(freq, when, dur, vol, type) {
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  osc.connect(g);
  g.connect(backBus);
  osc.start(when);
  osc.stop(when + dur + 0.05);
}

function scheduleBacking(song, chords, speed, audioT0) {
  const beatSec = 60 / song.bpm;                          // one beat at 100% speed
  const pattern = [0, 2, 1, 2];                           // which chord tone gets plucked on each beat
  for (const c of chords) {
    const info = chordInfo(c.name);
    const base = 48 + info.rootPc;                        // the chord root, in the octave starting at C3
    const beats = Math.max(1, Math.round(c.d / beatSec));
    for (let k = 0; k < beats; k++) {
      const when = audioT0 + (c.t + k * beatSec) / speed;
      const tone = info.tones[pattern[k % 4] % info.tones.length];
      playPluck(midiToFreq(base + 12 + tone), when, (beatSec / speed) * 1.6, 0.22, 'triangle');
      if (k % 2 === 0) playPluck(midiToFreq(base - 12), when, (beatSec / speed) * 1.8, 0.4, 'triangle');   // bass
    }
  }
}

function beginSong() {
  const song = SONGS[songSel.value];
  const speed = Number(speedSlider.value) / 100;          // 1 = full speed, 0.8 = 80%...
  const semis = songKeyShift;
  const melVol = Number(melSlider.value) / 100;           // vocal guide volume: 0 = backing track only
  const flats = usesFlats(wrap12(song.keyTonic + semis), song.keyMode);
  const noteNames = flats ? FLAT_NAMES : NOTE_NAMES;
  flatLabels = flats;

  const beatMs = 60000 / (song.bpm * speed);              // one beat, on the screen's clock
  const leadMs = LEAD_IN_BEATS * beatMs;                  // the "3, 2, 1" count-in
  const startDelay = 0.1;
  const syncMs = autoSyncMs() + Number(syncSlider.value);
  const t0 = performance.now() + startDelay * 1000 + leadMs + syncMs;   // when song time 0 is heard
  const audioT0 = audioCtx.currentTime + startDelay + leadMs / 1000;    // the same moment on the audio clock
  const toMs = sec => t0 + (sec / speed) * 1000;          // song seconds -> screen clock

  const notes = song.notes.map(n => ({
    midi: n.midi + semis,
    label: noteNames[wrap12(n.midi + semis)],             // the note letter shown inside the box
    sub: '',
    startMs: toMs(n.t), endMs: toMs(n.t + n.d),
    round: 0, score: 0, total: 0, signed: 0, voiced: 0
  }));
  const chords = song.chords.map(c => ({
    name: transposeChord(c.name, semis, flats),
    t: c.t, d: c.d,
    startMs: toMs(c.t), endMs: toMs(c.t + c.d)
  }));
  const lyrics = song.lyrics.map(l => ({
    text: l.text,
    startMs: toMs(l.t),
    words: (l.words || []).map(wd => ({ text: wd.text, startMs: toMs(wd.t) }))
  }));

  const lastMs = Math.max(notes[notes.length - 1].endMs, chords.length ? chords[chords.length - 1].endMs : 0);
  warmup = {
    notes: notes,
    rests: [],
    rounds: 1,
    beatMs: beatMs,
    anyOctave: octaveChk.checked,
    song: {
      title: song.title, chords: chords, lyrics: lyrics,
      speedPct: Math.round(speed * 100), keyName: keyNameFor(song, semis)
    },
    endMs: lastMs + 600
  };

  history.length = 0;
  viewSemitones = SONG_VIEW_SEMITONES;
  visibleSeconds = SONG_VISIBLE_SECONDS;
  const lowNote = Math.min(...notes.map(n => n.midi)), highNote = Math.max(...notes.map(n => n.midi));
  viewCenter = (lowNote + highNote) / 2;

  // --- sounds, all scheduled on the audio clock ---
  backBus = audioCtx.createGain();
  backBus.gain.value = 1;
  backBus.connect(getOutBus());
  scheduleBacking(song, chords, speed, audioT0);

  if (melVol > 0) {
    pianoBus = audioCtx.createGain();
    pianoBus.gain.value = melVol;
    pianoBus.connect(getOutBus());
    // reference note during the count-in: the first note of the melody
    playPianoNote(midiToFreq(notes[0].midi), audioT0 - leadMs / 1000, Math.max(0.3, leadMs / 1000 - 0.1));
    for (const n of notes) {
      const when = audioT0 + (n.startMs - t0) / 1000;
      playPianoNote(midiToFreq(n.midi), when, (n.endMs - n.startMs) / 1000);
    }
  }

  if (metroChk.checked && METRONOME_VOLUME > 0) {
    clickBus = audioCtx.createGain();
    clickBus.gain.value = 1;
    clickBus.connect(getOutBus());
    for (let k = 1; k <= LEAD_IN_BEATS; k++) playClick(audioT0 - (k * beatMs) / 1000, false);
    const totalBeats = Math.round(song.duration / (60 / song.bpm));
    for (let b = 0; b < totalBeats; b++) {
      playClick(audioT0 + (b * beatMs) / 1000, b % song.beatsPerBar === 0);
    }
  }

  setModeButtonsEnabled(false);
  setPanelsCollapsed(true);
  refreshButton();
}

// ---- Chord strip: |--- Am ---|--- C ---| scrolling along the top of the map ----
function drawChordStrip(now, w, plotLeft, plotWidth, nowX, pxPerSec, stripH) {
  const yMid = stripH / 2;
  ctx2d.textBaseline = 'middle';
  ctx2d.textAlign = 'right';
  ctx2d.fillStyle = '#5b6482';
  ctx2d.font = '10px system-ui';
  ctx2d.fillText('chords', plotLeft - 8, yMid);

  ctx2d.save();
  ctx2d.beginPath();
  ctx2d.rect(plotLeft, 0, plotWidth, stripH);
  ctx2d.clip();
  ctx2d.textAlign = 'center';
  for (const c of warmup.song.chords) {
    const x1 = nowX + ((c.startMs - now) / 1000) * pxPerSec;
    const x2 = nowX + ((c.endMs - now) / 1000) * pxPerSec;
    if (x2 < plotLeft || x1 > w) continue;
    const isCurrent = now >= c.startMs && now < c.endMs;

    if (isCurrent) {
      ctx2d.fillStyle = 'rgba(108,140,255,0.22)';
      ctx2d.fillRect(x1, 2, x2 - x1, stripH - 4);
    }
    // the "|" at the start of each chord
    ctx2d.strokeStyle = 'rgba(138,146,171,0.7)';
    ctx2d.lineWidth = 1.5;
    ctx2d.beginPath();
    ctx2d.moveTo(x1, 5);
    ctx2d.lineTo(x1, stripH - 5);
    ctx2d.stroke();

    // the label stays visible while the chord slides under the left edge
    const vx1 = Math.max(x1, plotLeft), vx2 = Math.min(x2, w);
    if (vx2 - vx1 < 22) continue;
    const cx = (vx1 + vx2) / 2;
    ctx2d.font = 'bold 14px system-ui';
    const tw = ctx2d.measureText(c.name).width;

    // the "---" either side of the label
    ctx2d.strokeStyle = 'rgba(138,146,171,0.35)';
    ctx2d.lineWidth = 1;
    ctx2d.beginPath();
    if (cx - tw / 2 - 6 > vx1 + 6) { ctx2d.moveTo(vx1 + 6, yMid); ctx2d.lineTo(cx - tw / 2 - 6, yMid); }
    if (cx + tw / 2 + 6 < vx2 - 6) { ctx2d.moveTo(cx + tw / 2 + 6, yMid); ctx2d.lineTo(vx2 - 6, yMid); }
    ctx2d.stroke();

    ctx2d.fillStyle = isCurrent ? '#ffffff' : '#c8cfee';
    ctx2d.fillText(c.name, cx, yMid);
  }
  // the "now" line carries on through the strip
  ctx2d.strokeStyle = 'rgba(242,244,250,0.55)';
  ctx2d.lineWidth = 2;
  ctx2d.beginPath();
  ctx2d.moveTo(nowX, 0);
  ctx2d.lineTo(nowX, stripH);
  ctx2d.stroke();
  ctx2d.restore();
}

// ---- Lyrics: the current line is big and in the middle, with the lines before/after it faded.
// ---- Words turn blue as you reach them, and the lines slide up when a new one starts.
function drawLyrics(now, w, h, areaH) {
  const lines = warmup.song.lyrics;
  if (!lines.length) return;
  const areaTop = h - areaH;

  ctx2d.save();
  ctx2d.beginPath();
  ctx2d.rect(0, areaTop, w, areaH);
  ctx2d.clip();
  ctx2d.textBaseline = 'middle';
  ctx2d.textAlign = 'left';

  // which line is current, and how far through the slide to the next line are we?
  let idx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].startMs <= now) idx = i; else break;
  }
  let pos = -1;                                            // "-1" = nothing has started yet
  if (idx >= 0) {
    const t = Math.min(1, Math.max(0, (now - lines[idx].startMs) / 350));   // the slide takes 350 ms
    pos = idx - 1 + t * t * (3 - 2 * t);
  }

  const lineH = 27;
  const centerY = areaTop + areaH / 2;
  const availW = w - 28;
  for (let k = Math.max(0, Math.floor(pos) - 1); k <= Math.min(lines.length - 1, Math.ceil(pos) + 2); k++) {
    const d = k - pos;                                     // 0 = in the middle, -1 = one line above...
    const y = centerY + d * lineH;
    if (y < areaTop - lineH || y > h + lineH) continue;
    const closeness = Math.max(0, 1 - Math.abs(d));
    drawLyricLine(lines[k], w / 2, y, 14 + 4 * closeness, 0.32 + 0.68 * closeness, k === idx, now, availW);
  }
  ctx2d.restore();
}

function drawLyricLine(line, cx, y, fs, alpha, isCurrent, now, availW) {
  const words = (line.words && line.words.length) ? line.words : [{ text: line.text, startMs: Infinity }];
  let total = 0, space = 0;
  for (;;) {                                               // shrink the text until the whole line fits
    ctx2d.font = (isCurrent ? 'bold ' : '') + fs + 'px system-ui';
    space = ctx2d.measureText(' ').width;
    total = space * (words.length - 1);
    for (const wd of words) total += ctx2d.measureText(wd.text).width;
    if (total <= availW || fs <= 9) break;
    fs -= 1;
  }
  let x = cx - total / 2;
  for (const wd of words) {
    const sung = isCurrent && now >= wd.startMs;
    ctx2d.fillStyle = sung ? '#9db4ff' : 'rgba(242,244,250,' + (isCurrent ? 0.85 : alpha) + ')';
    ctx2d.fillText(wd.text, x, y);
    x += ctx2d.measureText(wd.text).width + space;
  }
}

// Sets the main button's label and colour to match what it will do
function refreshButton() {
  if (mode === 'free') {
    btn.textContent = running ? 'Stop' : 'Start';
    btn.classList.toggle('stop', running);
  } else {
    const what = mode === 'song' ? 'song' : 'warmup';
    btn.textContent = (warmup ? 'Stop ' : 'Start ') + what;
    btn.classList.toggle('stop', !!warmup);
  }
}

function setModeButtonsEnabled(enabled) {
  modeFreeBtn.disabled = !enabled;
  modeWarmupBtn.disabled = !enabled;
  modeSongBtn.disabled = !enabled;
}

function setMode(newMode) {
  mode = newMode;
  modeFreeBtn.classList.toggle('active', mode === 'free');
  modeWarmupBtn.classList.toggle('active', mode === 'warmup');
  modeSongBtn.classList.toggle('active', mode === 'song');
  warmupControls.hidden = (mode !== 'warmup');
  songControls.hidden = (mode !== 'song');
  document.getElementById('moreWarmup').hidden = (mode === 'free');     // guide sounds/sync matter in warmups and songs
  pianoChk.parentElement.hidden = (mode === 'song');                    // songs use the "Vocal guide" slider instead
  resultsEl.hidden = true;
  refreshButton();
  statusEl.textContent = mode === 'warmup'
    ? 'Use wired headphones if the piano is on, or the mic will hear it.'
    : mode === 'song'
    ? 'Use wired headphones, or the mic will pick up the backing track.'
    : 'Tip: use headphones later when playing backing tracks.';
}

// "More settings" button: slides the extra settings open/closed
const moreBtn = document.getElementById('moreBtn');
moreBtn.addEventListener('click', () => {
  const nowOpen = document.getElementById('moreWrap').classList.toggle('collapsed') === false;
  moreBtn.classList.toggle('open', nowOpen);
  moreBtn.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
});

modeFreeBtn.addEventListener('click', () => setMode('free'));
modeWarmupBtn.addEventListener('click', () => setMode('warmup'));
modeSongBtn.addEventListener('click', () => setMode('song'));

btn.addEventListener('click', async () => {
  if (mode === 'free') {
    running ? stop() : start();
    return;
  }
  // Warmup or song mode
  if (warmup) { cancelWarmup(); return; }
  resultsEl.hidden = true;
  if (!running) await start();     // the warmup / song needs the mic on
  if (!running) return;            // mic was blocked
  if (mode === 'song') beginSong(); else beginWarmup();
});

// Draw the empty graph straight away so the layout is visible before pressing Start
drawGraph(performance.now());
// Redraw whenever the graph changes size (window resize, or the settings sliding away/back)
new ResizeObserver(() => drawGraph(running ? performance.now() : lastDrawNow))
  .observe(document.getElementById('graphWrap'));
</script>
</body>
</html>
